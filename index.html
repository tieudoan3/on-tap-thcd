let selectedQuestions = [], isTest = false, startTime;

function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".tab-btn")[tab === 'practice' ? 0 : 1].classList.add("active");
  document.getElementById("practice-tab").classList.toggle("hidden", tab !== 'practice');
  document.getElementById("test-tab").classList.toggle("hidden", tab !== 'test');
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.add("hidden");
}

function startPractice() {
  const topic = document.getElementById("topic-select").value;
  if (!topic) return alert("Chọn chủ đề để bắt đầu!");
  selectedQuestions = allQuestions[topic];
  isTest = false;
  beginQuiz();
}

function startTest() {
  let combined = [];
  Object.values(allQuestions).forEach(arr => combined.push(...arr));
  selectedQuestions = shuffle(combined).slice(0, 50).map(q => ({ ...q, options: shuffle(q.options) }));
  isTest = true;
  beginQuiz();
  startTimer(15 * 60);
}

function beginQuiz() {
  document.getElementById("quiz-form").innerHTML = "";
  document.getElementById("quiz-screen").classList.remove("hidden");
  document.getElementById("timer").style.display = isTest ? "block" : "none";
  document.getElementById("result-screen").classList.add("hidden");

  const labels = ['a', 'b', 'c', 'd'];

  selectedQuestions.forEach((q, i) => {
    const block = document.createElement("div");
    block.className = "question-block";

    // Shuffle options
    const shuffled = shuffle([...q.options]);

    block.innerHTML = `<strong>Câu ${i + 1}: ${q.question}</strong><br>` +
      shuffled.map((opt, idx) => `
        <label class="option">
          <input type="radio" name="q${i}" value="${opt.charAt(0)}"> ${labels[idx]}. ${opt.slice(3)}
        </label>
      `).join("");

    document.getElementById("quiz-form").appendChild(block);
  });
}


function submitQuiz() {
  clearInterval(startTime); // Nếu có sử dụng đồng hồ đếm

  const form = document.getElementById("quiz-form");
  const resultGrid = document.getElementById("result-grid");
  const resultDiv = document.getElementById("review");
  const scoreBox = document.getElementById("score");

  resultGrid.innerHTML = "";
  resultDiv.innerHTML = "";

  let score = 0;

  selectedQuestions.forEach((q, i) => {
    const selected = form.querySelector(`input[name=q${i}]:checked`);
    const userAns = selected ? selected.value : "-";
    const isCorrect = userAns === q.answer;
    if (isCorrect) score++;

    // Tạo ô kết quả
    const box = document.createElement("div");
    box.className = `result-box ${isCorrect ? 'correct-box' : 'incorrect-box'}`;
    box.textContent = i + 1;
    box.onclick = () => {
      document.querySelectorAll('.question-block').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`question-${i}`);
      if (target) {
        target.classList.remove('hidden');
        window.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
      }
    };
    resultGrid.appendChild(box);

    // Tạo phần hiển thị lại câu hỏi + tô màu
    const block = document.createElement("div");
    block.className = "question-block hidden";
    block.id = `question-${i}`;
    block.innerHTML = `<strong>Câu ${i + 1}: ${q.question}</strong><br>` +
      q.options.map(opt => {
        const key = opt[0];
        const text = opt.slice(3);
        const isUserWrong = userAns === key && key !== q.answer;
        const isCorrectAns = key === q.answer;
        let colorClass = '';
        if (isCorrectAns) colorClass = 'correct';
        if (isUserWrong) colorClass = 'incorrect';
        return `<div class="${colorClass}">${key.toUpperCase()}. ${text}</div>`;
      }).join("");
    resultDiv.appendChild(block);
  });

  // Hiển thị kết quả tổng
  const diem = ((score / selectedQuestions.length) * 10).toFixed(2);
  scoreBox.innerText = `Bạn đúng ${score}/${selectedQuestions.length} câu. Điểm: ${diem}`;
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.remove("hidden");
}


function showAllQuestions() {
  document.querySelectorAll('.question-block').forEach(el => el.classList.remove('hidden'));
}


function startTimer(duration) {
  let time = duration;
  const timer = document.getElementById("timer");
  startTime = setInterval(() => {
    let min = String(Math.floor(time / 60)).padStart(2, '0');
    let sec = String(time % 60).padStart(2, '0');
    timer.innerText = `⏰ Thời gian còn lại: ${min}:${sec}`;
    if (--time < 0) submitQuiz();
  }, 1000);
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}
